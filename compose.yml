services:
  server:
    container_name: netbridge-server
    build:
      context: .
      dockerfile: ./docker/Dockerfile.server
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env
    environment:
      PORT: "8080"
      BIND_ADDR: 0.0.0.0
      TUNNEL_TYPE: server
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - netbridge

  client:
    container_name: netbridge-client
    build:
      context: .
      dockerfile: ./docker/Dockerfile.client
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8081"
    env_file:
      - .env
    environment:
      PORT: "8081"
      BIND_ADDR: 0.0.0.0
      TUNNEL_TYPE: client
      SOCKET_URL: ws://server:8080/_ws
    depends_on:
      - server
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - netbridge

networks:
  netbridge:
